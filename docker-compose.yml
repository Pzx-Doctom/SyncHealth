services:
  # ============================================================
  # 后端服务 (FastAPI + SQLite + WebSocket)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/pzx-doctom/synchealth-backend:latest
    container_name: synchealth-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DEBUG=False
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - synchealth-net

  # ============================================================
  # Nginx（前端构建产物已打入镜像，无需 frontend-build 服务）
  # 宿主机 8080 → 容器 80
  # ============================================================
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: ghcr.io/pzx-doctom/synchealth-nginx:latest
    container_name: synchealth-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synchealth-net

volumes:
  backend_data:
    driver: local

networks:
  synchealth-net:
    driver: bridge
