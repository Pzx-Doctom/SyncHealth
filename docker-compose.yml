services:
  # ============================================================
  # 后端服务 (FastAPI + SQLite + WebSocket)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synchealth-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DEBUG=False
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - synchealth-net

  # ============================================================
  # 前端构建（一次性容器，构建完即退出）
  # ============================================================
  frontend-build:
    image: node:20-alpine
    container_name: synchealth-frontend-build
    working_dir: /app
    command: sh -c "npm ci && VITE_API_BASE_URL=/api/v1 npm run build"
    environment:
      - VITE_API_BASE_URL=/api/v1
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    networks:
      - synchealth-net

  # ============================================================
  # Nginx 反向代理 + 静态文件服务
  # 宿主机 8080 → 容器 80（避免与 DocVoice 的 80 端口冲突）
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: synchealth-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    networks:
      - synchealth-net

volumes:
  backend_data:
    driver: local
  frontend_dist:
    driver: local

networks:
  synchealth-net:
    driver: bridge
